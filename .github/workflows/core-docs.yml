name: Deploy pfd-core documentation
on:
  push:
    branches: [main]
    paths: ["docs/core-site/**", ".github/workflows/core-docs.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/core-site
      - id: deployment
        uses: actions/deploy-pages@v4
