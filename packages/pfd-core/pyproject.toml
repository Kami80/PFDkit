[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pfd-core"
version = "0.1.0"
description = "Typed process flow diagram documents, units, registry, and structural validation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "PFDkit contributors"}]
dependencies = ["pydantic>=2.13,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "mypy>=2.4,<3", "build>=1.3,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/pfd_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
